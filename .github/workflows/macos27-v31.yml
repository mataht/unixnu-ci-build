name: macos27-v31

on:
  push:
    branches:
      - ci/macos27-v31-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos27-v31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out V31 overlay
        uses: actions/checkout@v4
        with:
          path: repo
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 519d80242a5028ee123447b01bc3b809baed565f
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Check out UniXNU-sheng
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: c8f92b208068eeaa4cd2b0f592671f04ee70076e
          path: UniXNU-sheng
          submodules: recursive
          persist-credentials: false

      - name: Pin driver submodules
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          pins = json.loads(pathlib.Path('repo/ci-v31/overlay-manifest.json').read_text())['submodules']
          for rel, sha in sorted(pins.items()):
              cur = subprocess.check_output(['git', '-C', rel, 'rev-parse', 'HEAD'], text=True).strip()
              if cur != sha:
                  subprocess.run(['git', '-C', rel, 'fetch', '--depth=1', 'origin', sha], check=True)
                  subprocess.run(['git', '-C', rel, 'checkout', '-q', '--detach', 'FETCH_HEAD'], check=True)
              print(f'Pinned {rel} @ {sha[:12]}')
          PY

      - name: Install XNU build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install dtc llvm lld cmake mtools ninja bison pkgconf

      - name: Restore XNU & upstream driver feeds cache
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/feeds
            UniXNU-sheng/.cache/firmware
            UniXNU-sheng/drivers/Ath12kWifi/deps
            UniXNU-sheng/drivers/QcomIris/deps
            UniXNU-sheng/drivers/QcaBluetooth/out/linux
          key: unixnu-public-v31-xnu-feeds-v1-519d8024-c8f92b20
          restore-keys: |
            unixnu-public-v30-gpu-feeds-v1-519d8024-c8f92b20
            unixnu-public-v30-gpu-feeds-v1-
            unixnu-public-v28-gpu-feeds-v1-
            unixnu-public-feeds-v2-
            unixnu-public-feeds-v1-

      - name: Build & verify V31 kernel.macho
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
          OWNER_DATA_VOLUME_UUID: ${{ secrets.OWNER_DATA_VOLUME_UUID }}
        run: |
          python3 repo/ci-v31/ci_build_v31.py

      - name: Upload encrypted V31 kernel stage archive
        uses: actions/upload-artifact@v4
        with:
          name: v31-ci-stage-encrypted
          retention-days: 1
          if-no-files-found: error
          path: |
            v31-ci-stage.tar.gz.enc
            v31-ci-meta.json
